name: gnps_learning_hub
description: "Gurmukhi Sikho - A gamified Punjabi learning app for kids."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_riverpod: ^2.5.1
  audioplayers: ^6.8.1
  flutter_svg: ^2.0.10
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  qr: ^3.0.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_android_adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/icon_android_adaptive_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.jpg
    - assets/sounds/
    - assets/audio/lessons/alphabets/
    - assets/audio/lessons/words/
    - assets/audio/lessons/sentences/
    - assets/avatars/
    - assets/shop/
    - assets/data/
    - assets/data/lessons/
    - assets/data/games/
