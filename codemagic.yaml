workflows:
  default-workflow:
    name: Flutter Build
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - ios_credentials
        - web_deploy # Contains your GITHUB_TOKEN
      android_signing:
        - GNPS Upload
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Flutter version
        script: |
          flutter --version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run Flutter analyzer
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Generate Premium Brochure
        script: |
          dart tools/brochure/generate_full_brochure.dart

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Build Android APK
        script: |
          flutter build apk --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Build and Deploy Web
        script: |
          # 1. Build the release version with the correct base-href
          flutter build web --release \
            --base-href /gurmukhi-sikho-webapp/ \
            --pwa-strategy offline-first
          
          # 2. Archive for Codemagic download
          cd build/web && zip -r ../../web_build.zip .
          
          # 3. Deploy to the separate live repository
          # Setup git identity
          git config --global user.email "developer@gnps.nsw.edu.au"
          git config --global user.name "Codemagic CI"
          
          # Push to the live repo using the token
          git init
          git remote add origin https://$GITHUB_TOKEN@github.com/gnps-developer/gurmukhi-sikho-webapp.git
          git checkout -b main
          git add .
          git commit -m "Automated deploy from Codemagic build $PROJECT_BUILD_NUMBER"
          git push origin main --force

    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
      - build/ios/ipa/*.ipa
      - web_build.zip
      - exports/*.pdf
      - exports/brochure/*.pdf
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - developer@gnps.nsw.edu.au
        notify:
          success: true
          failure: true
