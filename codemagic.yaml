workflows:
  default-workflow:
    name: Flutter Build
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - ios_credentials # Placeholder for iOS certificates and profiles
      android_signing:
        - GNPS Upload
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Flutter version
        script: |
          flutter --version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run Flutter analyzer
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Generate Premium Brochure
        script: |
          dart tools/brochure/generate_full_brochure.dart

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Build Android APK
        script: |
          flutter build apk --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Build Web
        script: |
          flutter build web --release \
            --base-href / \
            --pwa-strategy offline-first
          cd build/web && zip -r ../../web_build.zip .

    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
      - build/ios/ipa/*.ipa
      - web_build.zip
      - exports/*.pdf
      - exports/brochure/*.pdf
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - developer@gnps.nsw.edu.au
        notify:
          success: true
          failure: true
